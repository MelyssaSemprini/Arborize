<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastrar Árvore</title>
    <link rel="stylesheet" href="/codigo-fonte/css/cadastrarArvore.css">
</head>

<body>

    <header class="p-3 bg-light d-flex justify-content-between align-items-center">
        <div class="header-logo">
            <svg id="icone" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="40" height="auto">
                <image href="/codigo-fonte/img/ICON - ARBORIZE.svg" x="20" y="20" width="60" height="60" />
            </svg>
            <h1>Arborize</h1>
        </div>
        <a href="#" class="login-link">Já tem uma conta? Faça o login.</a>
    </header>

    <main class="container">
        <div class="content">
            <!-- Formulário de cadastro de árvore -->
            <form id="tree-form" enctype="multipart/form-data">
                <div class="form-group">
                    <input type="text" id="especie" name="especie" placeholder="Espécie da árvore" required>
                </div>
                <div class="form-group">
                    <input type="text" id="geolocalizacao" name="geolocalizacao"
                        placeholder="Geolocalização (Ex: -23.5505, -46.6333)" required>
                </div>
                <div class="form-group">
                    <input type="date" id="data-plantio" name="data-plantio" required>
                </div>
                <div class="form-group">
                    <input type="text" id="origem" name="origem" placeholder="Origem (Ex: América do Sul)" required>
                </div>
                <div class="form-group">
                    <textarea id="curiosidade" name="curiosidade" rows="3"
                        placeholder="Curiosidade sobre a árvore"></textarea>
                </div>
                <div class="form-group">
                    <textarea id="descricao" name="descricao" rows="4" placeholder="Descrição da árvore"></textarea>
                </div>
                <button type="submit" class="submit-btn">Cadastrar</button>
            </form>

            <!-- Imagem e título fixos -->
            <div class="image-container">
                <img src="https://via.placeholder.com/250" alt="Árvore">
                <div class="image-title">
                    <span>10 🌟</span>
                    <p>Title here</p>
                </div>
            </div>
        </div>
    </main>
    <footer class="bg-light">
        <div class="container d-flex justify-content-between align-items-center footer-left">
            <a href="#">Privacidade</a> — <a href="#">Termos</a>
        </div>
    </footer>
</body>

</html>
