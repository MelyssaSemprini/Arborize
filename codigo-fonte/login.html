<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="author" content="Ana Clara Santos de Paula">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arborize | Login</title>
    <link rel="website icon" type="png" href="/codigo-fonte/img/LogoArborize.png">
    <link rel="stylesheet" type="text/css" href="css/login.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
    <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
</head>
<script type="text/javascript" src="/codigo-fonte/javascript/login.js"></script>
<body>

    <div class="btn-voltar">
        <a href="home.html" class="btn-voltar2" aria-label="Voltar a página anterior.">VOLTAR</a>
    </div>

    <div class="conteudo">
        <form action="">

            <h1>Login</h1>

            <div class="input-box">
                <input type="text" placeholder="Usuário" required>
                <i class="bx bxs-user"></i>
            </div>

            <div class="input-box">
                <input type="password" placeholder="Senha" required>
                <i class="bx bxs-lock-alt"></i>
            </div>

            <div class="remenber-forgot">
                <label><input type="checkbox">Lembrar-me</label>
                <!-- Parte do código para redefinir senha add pela Melyssa -->
                <a href="#" class="fade_4S" title="Esqueci minha senha" data-bs-toggle="modal"
                data-bs-target="#exampleModal"><i></i>Esqueci minha senha</a>   
            </div>

        <button type="submit" class="btn">ENTRAR</button>
       
        <div class="register-link">
            <p>Não tem uma conta? <a href="/codigo-fonte/cadastro.html">Cadastrar</a> </p>
        </div>   

        </form>

    </div>

    <!-- Código do modal para redefinir senha add por Melyssa -->

    <!--Modal-->
  <div class="modal fade" id="exampleModal" tabindex="-1" aria-labelledby="exampleModalLabel" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h1 class="modal-title fs-5" id="exampleModalLabel">Não se preocupe redefina sua senha</h1>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <form>
            <div class="mb-3">
              <label for="recipient-name" class="col-form-label">Redefinir senha:</label>
              <input type="email" class="form-control" id="recipient-name" placeholder="E-mail">
            </div>
          </form>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Enviar</button>
        </div>
      </div>
    </div>
  </div>
  
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
    crossorigin="anonymous">    
  </script>

<script src="https://cdn.jsdelivr.net/npm/emailjs-com@3/dist/email.min.js"></script>
<script>
  emailjs.init('hhaDAT9wWEGWH1Ti7qqt1'); // User ID do EmailJS
</script>
  </script>
    
</body>
</html>
